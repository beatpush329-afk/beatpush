# Netlify Configuration for BeatsPush Frontend

[build]
  # Build command
  command = "npm run build"
  
  # Directory with build output
  publish = ".next"
  
  # Base directory
  base = "frontend"

[build.environment]
  # Node.js version
  NODE_VERSION = "18.17.0"
  
  # Enable Next.js on Netlify
  NEXT_PRIVATE_TARGET = "server"

# Redirect rules for Next.js
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify Functions (if needed for serverless functions)
[functions]
  directory = "functions"
  node_bundler = "esbuild"

# Development settings
[dev]
  command = "npm run dev"
  port = 3000
  publish = ".next"
  autoLaunch = false
