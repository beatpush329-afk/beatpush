# Netlify Configuration for BeatsPush Frontend

[build]
  # Build command
  command = "npm run build"
  
  # Directory with build output
  publish = ".next"
  
  # Base directory
  base = "frontend"

[build.environment]
  # Node.js version - updated to Node 20 LTS (compatible with Netlify)
  NODE_VERSION = "20.11.0"
  # Skip type checking during build (already done locally)
  CI = "false"

# Next.js specific redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
