services:
  # Backend API
  - type: web
    name: beatpush-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: beatpush-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REDIS_URL
        fromService:
          type: redis
          name: beatpush-redis
          property: connectionString
    healthCheckPath: /

  # PostgreSQL Database
databases:
  - name: beatpush-db
    databaseName: beatpush
    plan: free
    region: oregon

  # Redis Cache
  - name: beatpush-redis
    plan: free
    region: oregon
    ipAllowList: []
