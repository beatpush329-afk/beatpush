services:
  # Backend API Service
  - type: web
    name: beatpush-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://beatpush-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: beatpush-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"

  # Frontend Static Site
  - type: web
    name: beatpush-frontend
    env: node
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npx serve@latest out -p $PORT"
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://beatpush-c1gs.onrender.com
      - key: NODE_VERSION
        value: "20.11.0"

databases:
  - name: beatpush-db
    databaseName: beatpush
    user: beatpush
    plan: free
    region: oregon
